<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Busca de Endereço por CEP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="titulo-topo">
        Atividade Avaliativa — Consumo de API pública
    </div>

    <main class="container">

        <div class="faixa"></div>

        <section class="conteudo">

            <header class="cabecalho">
                <div>
                    <h1>Busca de Endereço</h1>
                    <p>Consulta por CEP</p>
                </div>

                <span class="selo">VIA CEP</span>
            </header>

            <div class="linha"></div>

            <label for="cep-input">Digite o CEP</label>

            <div class="busca">

                <input
                    type="text"
                    id="cep-input"
                    placeholder="00000-000"
                    maxlength="9"
                    inputmode="numeric"
                    autocomplete="off"
                >

                <button id="search-btn">
                    BUSCAR
                </button>

            </div>

            <p class="dica">
                Digite apenas os números. Exemplo: 01310-100
            </p>

            <div id="result-area"></div>

            <footer>
                ViaCEP · API pública · Sem chave de acesso
            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
